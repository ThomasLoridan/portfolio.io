<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thomas Loridan — Engineer the intelligence, ship the product</title>
  <meta name="description" content="Thomas Loridan — Technical Product Manager, AI Engineer, and TPM. Specs, code, and the occasional manifesto." />
  <link rel="icon" type="image/png" href="project/assets/profile.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
/* ============ TOKENS ============ */
:root {
  --bg-primary:   #FFFFFF;
  --bg-paper:     #F2EFE9;
  --fg-1:         #1A1A1A;
  --fg-2:         #5A5A5A;
  --fg-3:         #A8A8A8;
  --fg-border:    #E8E6E2;
  --navy:         #0A2E5C;
  --blue:         #2E7DE9;
  --brass:        #B8924A;
  --success:      #1A7040;
  --danger:       #B8291A;
  --font-serif:   'DM Serif Display', 'Times New Roman', serif;
  --font-sans:    'Syne', system-ui, -apple-system, sans-serif;
  --font-mono:    'DM Mono', 'Courier New', monospace;
  --w-regular:    400;
  --w-semibold:   600;
  --w-bold:       700;
  --r-pill:       100px;
  --r-card:       12px;
  --r-component:  8px;
  --r-button:     4px;
  --s-1:          4px;
  --s-2:          8px;
  --s-3:          16px;
  --s-4:          24px;
  --s-5:          40px;
  --s-6:          64px;
  --border-hair:  0.5px solid var(--fg-border);
  --border-thin:  1px solid var(--fg-border);
  --ease-expo-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:     180ms;
  --dur-base:     320ms;
  --dur-slow:     560ms;
}

/* ============ RESET ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
html, body {
  background: var(--bg-primary);
  color: var(--fg-1);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
img { display: block; max-width: 100%; }

/* ============ NAV ============ */
.tl-nav {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  z-index: 60;
  display: flex; align-items: center; gap: 24px;
  padding: 10px 14px 10px 22px;
  background: rgba(255,255,255,0.74);
  backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
  border: 0.5px solid var(--fg-border);
  border-radius: var(--r-pill);
  transition: transform 360ms var(--ease-expo-out), opacity 320ms;
}
.tl-nav.hidden { transform: translate(-50%, -120%); opacity: 0; }
.tl-nav-logo {
  font-family: var(--font-serif); font-style: italic; font-size: 18px;
  color: var(--fg-1); letter-spacing: -0.01em;
}
.tl-nav-logo span { color: var(--blue); }
.tl-nav-links { display: flex; gap: 22px; }
.tl-nav-link {
  font-family: var(--font-sans); font-weight: 500; font-size: 13px;
  color: var(--fg-2); transition: color 180ms;
}
.tl-nav-link:hover, .tl-nav-link.active { color: var(--fg-1); }
.tl-lang {
  display: flex; align-items: center; gap: 2px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  background: transparent; border: 1px solid var(--fg-border); border-radius: var(--r-pill);
  padding: 4px 4px;
}
.tl-lang button {
  background: transparent; border: none; padding: 4px 10px; border-radius: var(--r-pill);
  color: var(--fg-2); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  transition: all var(--dur-fast) var(--ease-expo-out);
}
.tl-lang button.on { background: var(--fg-1); color: #fff; }
@media (max-width: 780px) { .tl-nav-links { display: none; } }

/* ============ TYPE ============ */
.overline {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-2);
}
.overline .dot { color: var(--blue); margin-right: 8px; }
.h-display {
  font-family: var(--font-serif); font-weight: 400;
  font-size: clamp(54px, 8.2vw, 124px);
  line-height: 0.98; letter-spacing: -0.025em; color: var(--fg-1);
  text-wrap: balance;
}
.h-display .accent { font-style: italic; color: var(--blue); }
.h1 {
  font-family: var(--font-serif); font-weight: 400;
  font-size: clamp(40px, 5.4vw, 72px);
  line-height: 1.02; letter-spacing: -0.02em; color: var(--fg-1);
  text-wrap: balance;
}
.h1 .accent { font-style: italic; color: var(--blue); }
.h2 {
  font-family: var(--font-sans); font-weight: 700;
  font-size: clamp(24px, 2.4vw, 32px); line-height: 1.15;
  letter-spacing: -0.01em;
}
.h3 {
  font-family: var(--font-sans); font-weight: 600;
  font-size: 20px; line-height: 1.25;
}
.body { font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--fg-1); }
.body-lg { font-family: var(--font-sans); font-size: 19px; line-height: 1.55; color: var(--fg-1); text-wrap: pretty; }
.muted { color: var(--fg-2); }

/* ============ BUTTONS / TAGS ============ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-sans); font-weight: 600; font-size: 13px;
  border: none; padding: 12px 22px; border-radius: var(--r-pill);
  transition: all var(--dur-fast) var(--ease-expo-out);
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--fg-1); color: #fff; }
.btn-primary:hover { background: #000; }
.btn-ghost { background: transparent; color: var(--fg-1); border: 1px solid var(--fg-1); }
.btn-ghost:hover { background: var(--fg-1); color: #fff; }
.tag {
  display: inline-flex; align-items: center; padding: 4px 10px;
  border-radius: var(--r-button); border: 1px solid var(--fg-border);
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--fg-2);
}
.tag.blue { color: var(--blue); border-color: rgba(46,125,233,0.35); background: rgba(46,125,233,0.08); }
.tag.navy { color: var(--navy); border-color: rgba(10,46,92,0.35); background: rgba(10,46,92,0.06); }
.tag.brass { color: var(--brass); border-color: rgba(184,146,74,0.4); background: rgba(184,146,74,0.08); }

/* ============ LAYOUT ============ */
.section {
  max-width: 1200px; margin: 0 auto;
  padding: 120px 32px;
  position: relative;
}
.section-paper {
  background: var(--bg-paper); max-width: none;
  padding: 120px 32px;
}
.section-paper > .inner { max-width: 1200px; margin: 0 auto; }
.section-head {
  display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: end;
  margin-bottom: 64px;
}
.section-head .head-left { display: flex; flex-direction: column; gap: 16px; }
.section-head .head-right { padding-bottom: 8px; }
@media (max-width: 820px) {
  .section { padding: 80px 24px; }
  .section-paper { padding: 80px 24px; }
  .section-head { grid-template-columns: 1fr; gap: 24px; margin-bottom: 40px; }
}

/* ============ HERO ============ */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 140px 32px 80px;
  overflow: hidden;
}
.hero-inner {
  position: relative; z-index: 2;
  max-width: 1100px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}
.hero-overline { margin-bottom: 8px; }
.hero-sub {
  font-family: var(--font-sans); font-size: clamp(16px, 1.4vw, 19px);
  line-height: 1.55; color: var(--fg-2); max-width: 620px;
  text-wrap: pretty;
}
.hero-cta { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.hero-scroll {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
  z-index: 2;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; color: var(--fg-3);
  text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.hero-scroll .line {
  width: 1px; height: 36px;
  background: linear-gradient(to bottom, transparent, var(--fg-2));
  animation: scroll-pulse 2.4s var(--ease-expo-out) infinite;
}
@keyframes scroll-pulse {
  0% { transform: scaleY(0); transform-origin: top; }
  60% { transform: scaleY(1); transform-origin: top; }
  60.01% { transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}

/* ============ SKILL BUBBLES ============ */
.bubble-field {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 1;
}
.bubble {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  background: #fff;
  border: 0.5px solid var(--fg-border);
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(10,46,92,0.04), 0 8px 24px -8px rgba(10,46,92,0.08);
  will-change: transform;
  pointer-events: auto;
  transition: box-shadow 240ms var(--ease-expo-out), border-color 200ms;
}
.bubble:hover {
  border-color: var(--fg-1);
  box-shadow: 0 2px 4px rgba(10,46,92,0.08), 0 12px 32px -10px rgba(10,46,92,0.18);
  z-index: 10;
}
.bubble .label {
  font-family: var(--font-mono); font-weight: 500;
  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--fg-1); user-select: none;
}
.bubble svg.logo, .bubble img.logo { width: 56%; height: 56%; object-fit: contain; }
.bubble img.logo.wide { width: 76%; height: 76%; }
.bubble.passive { pointer-events: none; opacity: 0.78; }
.bubble.passive:hover { box-shadow: 0 1px 2px rgba(10,46,92,0.04), 0 8px 24px -8px rgba(10,46,92,0.08); border-color: var(--fg-border); }
.bubble.size-lg { width: 96px; height: 96px; }
.bubble.size-md { width: 76px; height: 76px; }
.bubble.size-sm { width: 60px; height: 60px; }
.bubble.size-xs { width: 48px; height: 48px; }
.bubble.size-xs .label { font-size: 8.5px; }

/* ============ ABOUT ============ */
.about-grid {
  display: grid; grid-template-columns: 320px 1fr; gap: 72px; align-items: start;
}
.about-photo {
  position: relative; aspect-ratio: 1; border-radius: var(--r-card);
  overflow: hidden; background: var(--bg-paper);
  border: 0.5px solid var(--fg-border);
}
.about-photo img {
  width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(1) contrast(1.05);
  transition: filter 600ms var(--ease-expo-out), transform 800ms var(--ease-expo-out);
}
.about-photo:hover img { filter: grayscale(0) contrast(1); transform: scale(1.02); }
.about-photo .badge {
  position: absolute; bottom: 14px; left: 14px;
  padding: 6px 10px; background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px); border-radius: var(--r-pill);
  border: 0.5px solid var(--fg-border);
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--fg-1);
}
.about-photo .badge .pulse {
  width: 6px; height: 6px; border-radius: 999px; background: var(--success);
  display: inline-block; margin-right: 8px; vertical-align: middle;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(26,112,64,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(26,112,64,0); }
}
.about-copy {
  font-family: var(--font-sans); font-size: clamp(20px, 1.7vw, 26px);
  line-height: 1.45; color: var(--fg-1); text-wrap: pretty;
}
.about-copy .accent { font-style: italic; color: var(--blue); font-family: var(--font-serif); }
.about-meta {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 32px; margin-top: 40px;
  padding-top: 32px; border-top: 0.5px solid var(--fg-border);
}
.about-meta .cell { display: flex; flex-direction: column; gap: 8px; }
.about-meta .cell .key {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--fg-2);
}
.about-meta .cell .val { font-family: var(--font-sans); font-weight: 500; font-size: 15px; color: var(--fg-1); }
@media (max-width: 820px) {
  .about-grid { grid-template-columns: 1fr; gap: 40px; }
  .about-photo { max-width: 280px; }
  .about-meta { grid-template-columns: 1fr 1fr; }
}

/* ============ STACK / SKILLS ============ */
.stack-wrap {
  position: relative; min-height: 740px;
  background: var(--bg-paper);
  border-radius: var(--r-card);
  border: 0.5px solid var(--fg-border);
  overflow: hidden;
}
.stack-wrap .center-pill {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: #fff; border: 0.5px solid var(--fg-border);
  border-radius: var(--r-pill); padding: 14px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 2;
}
.stack-wrap .center-pill .label-mono {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--fg-2);
}
.stack-wrap .center-pill .name {
  font-family: var(--font-serif); font-style: italic; font-size: 22px; color: var(--fg-1);
}
.stack-wrap .center-pill .name em { color: var(--blue); font-style: italic; }
.stack-tabs {
  position: absolute; top: 24px; left: 24px; z-index: 3;
  display: flex; gap: 8px;
}
.stack-tab {
  background: #fff; border: 0.5px solid var(--fg-border);
  border-radius: var(--r-pill); padding: 8px 14px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-2);
  transition: all var(--dur-fast) var(--ease-expo-out);
}
.stack-tab:hover { color: var(--fg-1); border-color: var(--fg-1); }
.stack-tab.on { background: var(--fg-1); color: #fff; border-color: var(--fg-1); }

/* ============ TIMELINE / EXPERIENCE ============ */
.timeline { display: flex; flex-direction: column; }
.tl-row {
  display: grid; grid-template-columns: 120px 1fr 280px;
  gap: 32px; align-items: center;
  padding: 28px 0; border-top: 0.5px solid var(--fg-border);
  cursor: default;
  transition: padding var(--dur-base) var(--ease-expo-out);
}
.tl-row:last-child { border-bottom: 0.5px solid var(--fg-border); }
.tl-row:hover { background: var(--bg-paper); padding-left: 16px; }
.tl-row .yr {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-2);
}
.tl-row .yr .span { color: var(--fg-1); font-weight: 500; }
.tl-row .ctx { display: flex; flex-direction: column; gap: 6px; }
.tl-row .ctx .company {
  font-family: var(--font-serif); font-size: clamp(28px, 3vw, 40px);
  line-height: 1.05; letter-spacing: -0.015em; color: var(--fg-1);
}
.tl-row .ctx .role {
  font-family: var(--font-sans); font-weight: 500; font-size: 15px; color: var(--fg-2);
}
.tl-row .ctx .role-desc {
  font-family: var(--font-sans); font-weight: 400; font-size: 14.5px; line-height: 1.55;
  color: var(--fg-1); max-width: 62ch; margin-top: 8px; text-wrap: pretty;
}
.tl-row .tl-media {
  height: 140px; border-radius: var(--r-card);
  overflow: hidden; background: var(--bg-paper);
  border: 0.5px solid var(--fg-border);
  display: flex; align-items: center; justify-content: center;
}
.tl-row .tl-media img { width: 100%; height: 100%; object-fit: cover; }
.tl-row .tl-media.contain img { object-fit: contain; padding: 18px; background: #fff; }
@media (max-width: 820px) {
  .tl-row { grid-template-columns: 1fr; gap: 14px; padding: 22px 0; }
  .tl-row .tl-media { height: 160px; }
}

/* ============ PROJECTS ============ */
.proj-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
}
.proj {
  background: #fff; border: 0.5px solid var(--fg-border); border-radius: var(--r-card);
  overflow: hidden; display: flex; flex-direction: column;
  transition: border-color var(--dur-fast) var(--ease-expo-out), transform 500ms var(--ease-expo-out);
}
.proj:hover { border-color: var(--fg-1); transform: translateY(-4px); }
.proj .media {
  position: relative; aspect-ratio: 4/3; overflow: hidden; background: var(--bg-paper);
}
.proj .media img { width: 100%; height: 100%; object-fit: cover; transition: transform 800ms var(--ease-expo-out); }
.proj:hover .media img { transform: scale(1.04); }
.proj .media .codename {
  position: absolute; top: 14px; left: 14px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: #fff;
  background: rgba(10,46,92,0.88); backdrop-filter: blur(6px);
  padding: 5px 10px; border-radius: var(--r-button);
}
.proj .media.placeholder {
  background: linear-gradient(135deg, var(--navy) 0%, #163e75 100%);
  display: flex; align-items: center; justify-content: center;
}
.proj .body { padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.proj .body h3 {
  font-family: var(--font-sans); font-weight: 700; font-size: 20px;
  letter-spacing: -0.005em; color: var(--fg-1);
}
.proj .body p { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: var(--fg-2); }
.proj .stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  padding-top: 14px; margin-top: 4px; border-top: 0.5px solid var(--fg-border);
}
.proj .stats .s { display: flex; flex-direction: column; gap: 2px; }
.proj .stats .s .n {
  font-family: var(--font-serif); font-style: italic; font-weight: 400;
  font-size: 28px; line-height: 1; color: var(--blue);
}
.proj .stats .s .n.brass { color: var(--brass); }
.proj .stats .s .k {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-2);
}
@media (max-width: 980px) { .proj-grid { grid-template-columns: 1fr; } }

.gh-link {
  margin-top: 32px;
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--fg-2);
  padding: 14px 22px; border: 0.5px solid var(--fg-border); border-radius: var(--r-pill);
  transition: all var(--dur-fast) var(--ease-expo-out);
}
.gh-link:hover { color: var(--fg-1); border-color: var(--fg-1); }
.gh-link .arr { transition: transform 240ms var(--ease-expo-out); }
.gh-link:hover .arr { transform: translateX(4px); }

/* ============ TESTIMONIALS ============ */
.testimonials {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
}
.quote {
  background: #fff; border: 0.5px solid var(--fg-border); border-radius: var(--r-card);
  padding: 32px 28px; display: flex; flex-direction: column; gap: 24px;
  transition: border-color var(--dur-base) var(--ease-expo-out);
}
.quote:hover { border-color: var(--fg-1); }
.quote .mark {
  font-family: var(--font-serif); font-style: italic; font-size: 64px; line-height: 0.4;
  color: var(--blue); height: 26px;
}
.quote .text {
  font-family: var(--font-sans); font-size: 15px; line-height: 1.6; color: var(--fg-1); flex: 1;
}
.quote .who { display: flex; flex-direction: column; gap: 4px; padding-top: 16px; border-top: 0.5px solid var(--fg-border); }
.quote .who .name { font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--fg-1); }
.quote .who .role { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-2); }
@media (max-width: 980px) { .testimonials { grid-template-columns: 1fr; } }

/* ============ BEYOND ============ */
.beyond-grid {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
}
.beyond-card {
  background: #fff; border: 0.5px solid var(--fg-border);
  border-radius: var(--r-card); overflow: hidden;
  display: flex; flex-direction: column;
  transition: border-color var(--dur-fast) var(--ease-expo-out), transform 500ms var(--ease-expo-out);
}
.beyond-card:hover { border-color: var(--fg-1); transform: translateY(-3px); }
.beyond-card .media { aspect-ratio: 4/3; overflow: hidden; background: var(--bg-paper); }
.beyond-card .media img { width: 100%; height: 100%; object-fit: cover; transition: transform 700ms var(--ease-expo-out); }
.beyond-card.contain .media img { object-fit: contain; padding: 24px; background: #fff; }
.beyond-card.contain.dark .media { background: var(--navy); }
.beyond-card.contain.dark .media img { background: var(--navy); }
.beyond-card:hover .media img { transform: scale(1.04); }

function SkillBubbles({ filter = "all", interactive = true, centerRepel = 100 }) {
  const containerRef = React.useRef(null);
  const bubbleRefs = React.useRef([]);
  const stateRef = React.useRef([]);
  const rafRef = React.useRef(0);
  const pointerRef = React.useRef({ x: -9999, y: -9999, active: false });

  const visible = React.useMemo(
    () => SKILLS.filter(s => filter === "all" || s.group === filter),
    [filter]
  );

  React.useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const rect = container.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    const cx = W / 2, cy = H / 2;
    stateRef.current = visible.map((s, i) => {
      const sizeMap = { lg: 96, md: 76, sm: 60, xs: 48 };
      const size = sizeMap[s.size] || 76;
      const angle = (i / visible.length) * Math.PI * 2 + Math.random() * 0.4;
      const ring = Math.min(W, H) * (0.28 + Math.random() * 0.16);
      const x = cx + Math.cos(angle) * ring - size / 2;
      const y = cy + Math.sin(angle) * ring - size / 2;
      const speed = 0.18 + Math.random() * 0.18;
      const dir = Math.random() * Math.PI * 2;
      return { x, y, size, vx: Math.cos(dir) * speed, vy: Math.sin(dir) * speed };
    });
  }, [visible]);

  React.useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    let lastT = performance.now();
    let visibleFlag = true;
    const onVisibility = () => { visibleFlag = !document.hidden; lastT = performance.now(); };
    document.addEventListener("visibilitychange", onVisibility);
    const onPointer = (e) => {
      const r = container.getBoundingClientRect();
      pointerRef.current.x = e.clientX - r.left;
      pointerRef.current.y = e.clientY - r.top;
      pointerRef.current.active = true;
    };
    const onLeave = () => { pointerRef.current.active = false; };
    container.addEventListener("pointermove", onPointer);
    container.addEventListener("pointerleave", onLeave);

    const step = (t) => {
      const dt = Math.min(48, t - lastT); lastT = t;
      if (!visibleFlag) { rafRef.current = requestAnimationFrame(step); return; }
      const rect = container.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      const cx = W / 2, cy = H / 2;
      const items = stateRef.current;
      const ptr = pointerRef.current;
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        if (ptr.active) {
          const dx = (it.x + it.size/2) - ptr.x;
          const dy = (it.y + it.size/2) - ptr.y;
          const d2 = dx*dx + dy*dy;
          const range = 140;
          if (d2 < range*range && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const f = (1 - d/range) * 0.6;
            it.vx += (dx/d)*f*(dt/16); it.vy += (dy/d)*f*(dt/16);
          }
        }
        const cdx = (it.x+it.size/2)-cx, cdy = (it.y+it.size/2)-cy;
        const cd2 = cdx*cdx+cdy*cdy;
        const safe = centerRepel + it.size/2;
        if (cd2 < safe*safe && cd2 > 0.01) {
          const d = Math.sqrt(cd2);
          const f = (1-d/safe)*0.4;
          it.vx += (cdx/d)*f*(dt/16); it.vy += (cdy/d)*f*(dt/16);
        }
        it.vx *= 0.985; it.vy *= 0.985;
        const drift = 0.004*(dt/16);
        it.vx += (Math.random()-0.5)*drift; it.vy += (Math.random()-0.5)*drift;
        const sp = Math.hypot(it.vx, it.vy);
        if (sp > 0.9) { it.vx = (it.vx/sp)*0.9; it.vy = (it.vy/sp)*0.9; }
        it.x += it.vx*(dt/16); it.y += it.vy*(dt/16);
        if (it.x < 8) { it.x = 8; it.vx = Math.abs(it.vx); }
        if (it.x > W-it.size-8) { it.x = W-it.size-8; it.vx = -Math.abs(it.vx); }
        if (it.y < 8) { it.y = 8; it.vy = Math.abs(it.vy); }
        if (it.y > H-it.size-8) { it.y = H-it.size-8; it.vy = -Math.abs(it.vy); }
        const el = bubbleRefs.current[i];
        if (el) el.style.transform = `translate(${it.x.toFixed(2)}px,${it.y.toFixed(2)}px)`;
      }
      for (let i = 0; i < items.length; i++) {
        for (let j = i+1; j < items.length; j++) {
          const a = items[i], b = items[j];
          const dx = (b.x+b.size/2)-(a.x+a.size/2);
          const dy = (b.y+b.size/2)-(a.y+a.size/2);
          const min = a.size/2+b.size/2+4;
          const d2 = dx*dx+dy*dy;
          if (d2 < min*min && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const overlap = (min-d)/2;
            const nx = dx/d, ny = dy/d;
            a.x -= nx*overlap; a.y -= ny*overlap;
            b.x += nx*overlap; b.y += ny*overlap;
            const av = a.vx*nx+a.vy*ny, bv = b.vx*nx+b.vy*ny;
            a.vx += (bv-av)*0.5*nx; a.vy += (bv-av)*0.5*ny;
            b.vx += (av-bv)*0.5*nx; b.vy += (av-bv)*0.5*ny;
          }
        }
      }
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener("visibilitychange", onVisibility);
      container.removeEventListener("pointermove", onPointer);
      container.removeEventListener("pointerleave", onLeave);
    };
  }, [visible]);

  return (
    <div ref={containerRef} className="bubble-field" style={{ position: "absolute", inset: 0 }}>
      {visible.map((s, i) => (
        <div key={s.id} ref={el => bubbleRefs.current[i] = el}
          className={`bubble size-${s.size} ${interactive ? "" : "passive"}`}
          title={interactive ? s.label : undefined}>
          {s.svg ? s.svg : <span className="label">{s.text || s.label}</span>}
        </div>
      ))}
    </div>
  );
}

window.SkillBubbles = SkillBubbles;

const { useState, useEffect, useRef, useMemo } = React;
const NAV_SECTIONS = ["about", "stack", "experience", "projects", "voice", "beyond", "credentials"];

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal:not(.no-anim)");
    els.forEach(el => { if (!el.classList.contains("in")) el.classList.add("pre"); });
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.remove("pre"); e.target.classList.add("in"); }
      });
    }, { rootMargin: "0px 0px -5% 0px", threshold: 0.01 });
    els.forEach(el => io.observe(el));
    const safety = setTimeout(() => {
      document.querySelectorAll(".reveal.pre").forEach(el => { el.classList.remove("pre"); el.classList.add("in"); });
    }, 2000);
    return () => { io.disconnect(); clearTimeout(safety); };
  }, []);
}

function useScrollSpy(ids, offset = 120) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY + offset;
      let cur = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= y) cur = id;
      }
      setActive(cur);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [ids, offset]);
  return active;
}

function Nav({ lang, setLang, t }) {
  const active = useScrollSpy(NAV_SECTIONS);
  return (
    <nav className="tl-nav" aria-label="Primary">
      <a href="#top" className="tl-nav-logo">Thomas <span>Loridan</span></a>
      <div className="tl-nav-links">
        {NAV_SECTIONS.map(id =>
          <a key={id} href={`#${id}`} className={`tl-nav-link ${active === id ? "active" : ""}`}>{t.nav[id]}</a>
        )}
      </div>
      <div className="tl-lang" role="group" aria-label="Language">
        <button className={lang === "en" ? "on" : ""} onClick={() => setLang("en")}>EN</button>
        <button className={lang === "fr" ? "on" : ""} onClick={() => setLang("fr")}>FR</button>
      </div>
    </nav>
  );
}

function App() {
  const [lang, setLang] = useState(() => {
    const stored = localStorage.getItem("tl-lang");
    if (stored === "fr" || stored === "en") return stored;
    return (navigator.language || "en").startsWith("fr") ? "fr" : "en";
  });
  useEffect(() => {
    localStorage.setItem("tl-lang", lang);
    document.documentElement.lang = lang;
  }, [lang]);
  const t = window.I18N[lang];
  useReveal();
  return (
    <>
      <Nav lang={lang} setLang={setLang} t={t} />
      <Hero t={t} />
      <About t={t} />
      <Stack t={t} />
      <Experience t={t} />
      <Projects t={t} />
      <Voice t={t} />
      <Beyond t={t} />
      <Credentials t={t} />
      <Footer t={t} />
    </>
  );
}
