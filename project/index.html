<body>
  <div id="root"></div>

  <script>
    // Map original asset paths to bundler resource IDs.
    // R(path) returns the blob URL if the bundler inlined the asset, otherwise the original path.
    window.__assetMap = {
      "assets/profile.png": "profile",
      "assets/devoteam.gif": "devoteam",
      "assets/amazon.gif": "amazon",
      "assets/auchan.gif": "auchan",
      "assets/loreal.gif": "loreal",
      "assets/sonar.jpg": "sonar",
      "assets/oracle.webp": "oracle",
      "assets/tennis.jpg": "tennis",
      "assets/asimov.jpg": "asimov",
      "assets/dune.jpg": "dune",
      "assets/aktionnaire.png": "aktionnaire",
      "assets/diary-ceo.jpg": "diaryceo",
      "assets/claude.png": "claude",
      "assets/google.png": "credGoogle",
      "assets/aws.png": "credAws",
      "assets/amazon-icon.png": "credAmazon",
      "assets/mckinsey.webp": "credMckinsey",
      "assets/forage.png": "credForage",
      "assets/loreal-logo.png": "credLoreal",
      "assets/logos/r.png": "logoR",
      "assets/logos/powerbi.png": "logoPowerbi",
      "assets/logos/quicksight.png": "logoQuicksight",
      "assets/logos/excel.png": "logoExcel",
      "assets/logos/jira.png": "logoJira",
      "assets/logos/confluence.png": "logoConfluence",
      "assets/logos/salesforce.png": "logoSalesforce",
      "assets/logos/ppt.png": "logoPpt"
    };
    window.R = function (path) {
      if (!path) return path;
      var id = window.__assetMap[path];
      if (id && window.__resources && window.__resources[id]) return window.__resources[id];
      return path;
    };
  </script>
